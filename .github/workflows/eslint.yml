# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint Code Scanning

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '33 10 * * 3'  # Weekly on Wednesdays at 10:33 UTC
  workflow_dispatch:

concurrency:
  group: eslint-sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: Upload ESLint SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read  # Required for uploading SARIF to security tab (private repos)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Install ESLint and SARIF formatter
        run: |
          npm install --no-save eslint@8.57.0
          npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          npx eslint . \
            --ext .js,.jsx,.mjs \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        if: always() && hashFiles('eslint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
